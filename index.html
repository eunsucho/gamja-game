<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#F3E6D2">
  <title>감자 취업시켜줘</title>
  <meta name="description" content="취준생 감자가 되어 공고 속 진짜 할 일을 받아치며 감자그룹 본사 옥상까지 올라가는 타자 게임">
  <!-- 메신저 공유 미리보기. 저장소 이름이나 주소가 바뀌면 og:image 와 og:url 도 같이 바꾼다 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="감자 취업시켜줘!! ㅜㅜ">
  <meta property="og:description" content="공고 속 진짜 할 일을 받아치며 감자그룹 본사 옥상까지 올라가는 타자 게임">
  <meta property="og:image" content="https://eunsucho.github.io/gamja-game/assets/share.jpg">
  <meta property="og:url" content="https://eunsucho.github.io/gamja-game/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="감자취업">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css?v=20261103m">
</head>
<body>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<div class="keyhint" id="keyhint" aria-hidden="true"></div>
<div class="app" id="app">

  <!-- 본사 앞 거리: 타이틀 -->
  <section id="v-title" class="scene">
    <div class="bg" style="background-image:url(assets/bg/street.jpg)"></div>
    <div class="col">
      <div class="title-top">
        <span class="eyebrow" id="season">감자그룹 공채</span>
        <h1 class="logo"><img src="assets/logo.png" alt="감자 취업시켜줘!!"></h1>
      </div>
      <div class="grow"></div>
      <div class="hero-center">
        <p class="bubble hand">나도 이제 취업한다…!</p>
        <img class="pot pot-xl" src="assets/potato_cut.png" alt="넥타이를 비뚤게 매고 지원서를 든 멍한 감자">
      </div>
      <button class="btn" id="toStart">시작!</button>
      <div class="row center">
        <button class="btn-sm glass" id="toIntro"><i class="ti ti-movie" aria-hidden="true"></i>감자극장</button>
        <button class="btn-sm glass" id="toWorksheet"><img src="assets/items/note.png" alt="">학습지</button>
        <button class="btn-sm glass" id="toInstall" hidden><img src="assets/icon-192.png" alt="">앱으로 설치</button>
        <button class="btn-sm glass" id="toDogam"><img src="assets/potato/lv4_gold.png" alt="">감자도감</button>
        <button class="btn-sm glass" id="toCredits"><i class="ti ti-info-circle" aria-hidden="true"></i>출처</button>
      </div>
    </div>
  </section>

  <!-- 세계관 인트로: 코미디 다큐 감자극장 -->
  <section id="v-intro" class="scene docu" hidden>
    <div class="bg kenburns" id="docuBg"></div>
    <div class="docu-shade"></div>
    <div class="col">
      <div class="docu-top">
        <span class="docu-tag" id="docuTag"></span>
        <button class="btn-sm glass" id="introSkip">건너뛰기</button>
      </div>
      <div class="docu-says" id="docuSays"></div>
      <div class="grow" id="docuTap"></div>
      <div class="rules glass" id="rulesCard" hidden></div>
      <p class="docu-sub" id="docuSub"></p>
      <div class="docu-ctrl">
        <span class="dots" id="introDots"></span>
        <button class="btn btn-next" id="introNext">다음</button>
      </div>
    </div>
  </section>

  <!-- 1층 로비 -->
  <section id="v-select" class="scene" hidden>
    <div class="bg" style="background-image:url(assets/bg/lobby.jpg)"></div>
    <div class="col">
      <div class="lobby-top">
        <button class="ibtn sub" id="backTitle" type="button" aria-label="처음으로"><i class="ti ti-arrow-left"></i></button>
        <h1 id="lobbyTitle"></h1>
      </div>
      <div class="lobby-hero"><img class="pedestal" src="assets/ui/pedestal.png" alt=""><img id="lobbyHero" src="assets/outfit/default.png" alt=""><span id="lobbyField"></span></div>
      <div class="list" id="postingList"></div>
      <div class="chips" id="wingTabs" role="tablist"></div>
      <div id="problems" class="warn glass" hidden></div>
    </div>
  </section>

  <!-- 엘리베이터 홀: 공고 -->
  <section id="v-brief" class="scene" hidden>
    <div class="bg" style="background-image:url(assets/bg/hall.jpg)"></div>
    <div class="col">
      <div class="lobby-top">
        <button class="ibtn sub" id="backSelect" type="button" aria-label="다른 공고"><i class="ti ti-arrow-left"></i></button>
      </div>
      <div class="sheet glass" id="brief"></div>
      <div class="grow"></div>
      <button class="btn" id="startGame"><span id="goLabel">지원서 제출</span></button>
    </div>
  </section>

  <!-- 엘리베이터 안: 플레이 -->
  <section id="v-play" class="scene play" hidden>
    <div class="bg" style="background-image:url(assets/bg/lift_day.jpg)"></div>
    <div class="bg fade" id="liftSunset" style="background-image:url(assets/bg/lift_sunset.jpg)"></div>
    <div class="bg fade" id="liftClouds" style="background-image:url(assets/bg/lift_clouds.jpg)"></div>
    <div class="stage"></div>

    <div class="sky" id="sky" aria-live="off">
      <div class="drops"></div>
      <div class="floats" id="floats"></div>
    </div>

    <div class="hud-wrap">
      <div class="hud">
        <span class="pill glass"><b id="hFloor">1F</b><span id="hRoom">로비</span></span>
        <span class="score"><b id="hScore">0</b><em id="hCombo" hidden></em></span>
        <span class="pill glass ai-count" id="hAiWrap" title="AI 동기가 가져간 일"><img src="assets/items/grab.png" alt="AI 동기가 가져간 일"><b id="hAi">0</b></span>
        <span class="pill glass letters" id="hFails" aria-label="불합격 문자"></span>
      </div>
      <p class="step-label" id="hStepLabel"><img src="assets/items/star.png" alt="합격 게이지"></p>
      <div class="steps" id="hSteps"></div>
      <div class="timebar" id="hTimeWrap"><i id="hTime"></i></div>
      <div class="salary glass" id="hSalaryWrap" hidden><i class="ti ti-coin" aria-hidden="true"></i>초봉 <b id="hSalary"></b>만 원</div>
    </div>
    <div class="notifs" id="notifs"></div>

    <div class="chars">
      <div class="who me mood-idle" id="hero">
        <img src="assets/potato_cut.png" alt="">
        <i class="fx spark s1"></i><i class="fx spark s2"></i><i class="fx spark s3"></i>
        <i class="fx aura"></i><i class="fx tear"></i><i class="fx badge"></i>
      </div>
      <p class="bubble hand" id="say" aria-live="polite"></p>
      <div class="who ai" id="buddy"><span class="buddy-say hand" id="buddySay"></span><img src="assets/ai_cut.png" alt="AI 동기"><span class="nameplate">AI 동기</span></div>
    </div>
    <div class="tut-tip glass hand" id="tutTip" hidden></div>

    <form id="typeForm" class="dock glass" autocomplete="off">
      <button class="ibtn sub" id="pauseBtn" type="button" aria-label="잠깐 멈춤"><img src="assets/items/pause.png" alt=""></button>
      <label for="typeInput" class="sr">단어 입력</label>
      <input id="typeInput" type="text" inputmode="text" enterkeyhint="send" placeholder="여기에 치고 Enter" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="ibtn" type="submit" aria-label="받아치기"><i class="ti ti-corner-down-left"></i></button>
    </form>

    <div class="overlay" id="doors">
      <div class="card-pop glass">
        <img class="pop-icon" id="dIcon" src="assets/items/check.png" alt="" hidden>
        <p class="ding" id="dDing"><i class="ti ti-bell-ringing" aria-hidden="true"></i>띵!</p>
        <p class="pop-title" id="dFloor"></p>
        <p class="pop-msg" id="dMsg"></p>
        <p class="pop-tip" id="dTip"></p>
        <div id="dHow" hidden></div>
        <div class="pop-terms" id="dTerms" hidden></div>
        <button class="btn" id="dGo" hidden>문 열기</button>
      </div>
    </div>
    <div class="overlay open" id="pausedCover">
      <div class="card-pop glass">
        <p class="pop-title">잠깐 멈춤</p>
        <div id="pauseHow"></div>
        <button class="btn" id="resumeBtn" type="button">계속</button>
        <button class="btn sub" id="quitBtn" type="button">그만하기</button>
      </div>
    </div>
  </section>

  <!-- 결과: 옥상 또는 1층 출구 + 감자 회고록 -->
  <section id="v-result" class="scene" hidden>
    <div class="bg" id="resultBg"></div>
    <div class="col">
      <div class="noti" id="notice" role="button" tabindex="0" aria-label="문자 열어 결과 보기"></div>
      <p class="tap-hint" id="tapHint">눌러서 확인</p>
      <div class="result-hero mini">
        <span class="hired-tag" id="hiredTag" hidden><img src="assets/items/badge.png" alt="">사원증!</span>
        <div class="who me big" id="resultHero"><img src="assets/potato_cut.png" alt=""><i class="fx badge"></i><i class="fx tear"></i></div>
        <p class="bubble hand" id="resultSay"></p>
      </div>
      <article class="memo" id="memo">
        <div class="memo-top"><span class="eyebrow"><img src="assets/items/note.png" alt="">회고록</span><span class="memo-count" id="memoCount"></span></div>
        <div class="memo-page" id="memoPage"></div>
        <div class="memo-nav">
          <button class="ibtn sub" id="memoPrev" type="button" aria-label="이전 장"><i class="ti ti-chevron-left"></i></button>
          <span class="dots" id="memoDots"></span>
          <button class="ibtn sub" id="memoNext" type="button" aria-label="다음 장"><i class="ti ti-chevron-right"></i></button>
        </div>
      </article>
      <p class="gate-note" id="memoGateNote" hidden></p>
      <div class="row">
        <button class="btn grow" id="retry"><img class="lk" src="assets/items/lock.png" alt="">다시 지원</button>
        <button class="btn sub fit" id="toSelect2"><img class="lk" src="assets/items/lock.png" alt="">로비</button>
      </div>
    </div>
  </section>

  <p class="ios-tip" id="iosTip" hidden><img src="assets/icon-192.png" alt="">공유 버튼 → <b>홈 화면에 추가</b>하면 꽉 찬 화면!<button type="button" id="iosTipX" aria-label="닫기">×</button></p>

  <dialog class="dogam" id="dogam">
    <div class="dogam-top"><img src="assets/potato/lv4_gold.png" alt=""><p class="pop-title">감자도감</p><span id="dogamCount"></span></div>
    <div class="dogam-grid" id="dogamGrid"></div>
    <form method="dialog"><button class="btn sub">닫기</button></form>
  </dialog>

  <dialog class="credits glass" id="credits">
    <p class="pop-title">출처</p>
    <p id="creditsText"></p>
    <form method="dialog"><button class="btn sub">닫기</button></form>
  </dialog>

</div>
<script type="module" src="js/main.js?v=20261103m"></script>
</body>
</html>
