<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 직무 판별 학습지</title>
<meta name="description" content="하나의 직업이 여러 직무로 이루어져 있음을 알고, 직무마다 AI가 어디까지 쓰이는지 예상해 분류하는 활동지">
<link rel="icon" href="../assets/potato_cut.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gamja+Flower&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root { --ink:#3E2F27; --ink-2:#6B5A4E; --bg:#F3E6D2; --card:#fff; --line:#5A3A12; --butter:#FFD978; --butter-2:#F5B53A;
  --o:#5B8DEF; --p:#F0A63A; --x:#E2506C; --n:#8A7B6E; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Pretendard Variable",Pretendard,sans-serif; line-height:1.55; word-break:keep-all; }
main { max-width:820px; margin:0 auto; padding:20px 16px 60px; }
h1,h2 { font-family:"Black Han Sans",sans-serif; font-weight:400; margin:0; }
h1 { font-size:clamp(28px,7vw,40px); }
.top { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
.btn { font:inherit; font-family:"Black Han Sans",sans-serif; font-size:17px; border:3px solid var(--line); border-radius:14px; padding:8px 16px; background:linear-gradient(var(--butter),var(--butter-2));
  color:#5A3A12; box-shadow:0 5px 0 var(--line); cursor:pointer; text-decoration:none; display:inline-block; transition:transform .08s, box-shadow .08s; }
.btn:active { transform:translateY(5px); box-shadow:0 0 0 var(--line); }
.btn.sub { background:#fff; }
.tabs { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 16px; }
.tabs button[aria-selected="true"] { background:linear-gradient(#FFE9A8,var(--butter)); }
.tabs button[aria-selected="false"] { background:#fff; }
.sheet { background:var(--card); border:3px solid var(--line); border-radius:20px; padding:18px; box-shadow:0 6px 0 rgba(90,58,18,.25); display:grid; gap:14px; }
.goal { background:#FFF6DA; border-radius:12px; padding:10px 14px; font-weight:600; }
.goal b { color:#9A5B00; }
.act h2 { font-size:22px; }
.act p { margin:4px 0 0; color:var(--ink-2); font-weight:600; font-size:15px; }
ol.tasks { list-style:none; padding:0; margin:10px 0 0; display:grid; gap:8px; }
ol.tasks li { display:flex; gap:10px; align-items:center; border:2px solid #E6D6C2; border-radius:14px; padding:8px 10px; cursor:pointer; background:#FFFCF6; }
ol.tasks li .num { flex:none; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-weight:800; background:#F3E6D2; }
ol.tasks li .t { flex:1; } ol.tasks li .t small { display:block; color:var(--ink-2); font-size:12px; }
ol.tasks li .mark { flex:none; min-width:44px; height:36px; border-radius:10px; border:2px dashed #CDB9A2; display:grid; place-items:center; font-weight:900; font-size:18px; }
ol.tasks li.pick .mark { border-style:solid; border-color:var(--n); background:#EFE8E1; }
li[data-g="O"] .mark { border:2px solid var(--o); color:var(--o); }
li[data-g="△"] .mark { border:2px solid var(--p); color:var(--p); }
li[data-g="X"] .mark { border:2px solid var(--x); color:var(--x); }
li.locked { opacity:.45; cursor:default; }
.ans { display:none; font-size:13px; font-weight:700; margin-top:2px; }
.reveal .ans { display:block; }
.ans.ok { color:#2E8B57; } .ans.no { color:var(--x); }
.legend { display:flex; flex-wrap:wrap; gap:8px; font-size:14px; font-weight:700; }
.legend span { border-radius:999px; padding:3px 10px; background:#F7F0E6; }
.count { font-weight:800; }
.foot { font-size:13px; color:var(--ink-2); margin-top:16px; }
@media print { .top .btn, .tabs, .no-print { display:none !important; } body { background:#fff; } .sheet { box-shadow:none; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>AI 직무 판별 학습지</h1><p style="margin:0;font-weight:600;color:var(--ink-2)">AEI 직무별 Automation 추론 활동 · 감자 취업시켜줘 수업용</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn sub" href="../">게임으로</a>
      <a class="btn sub" href="aei_lesson_worksheet.docx" download>한글/워드 파일</a>
      <button class="btn" onclick="print()">인쇄</button>
    </div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <section class="sheet" id="sheet"></section>
  <p class="foot">자료: Anthropic Economic Index 2026-06-26 릴리스(CC-BY), O*NET 31.0(CC BY 4.0). 수치는 사람들이 그 일을 AI에게 시킨 대화 중 AI가 끝까지 처리한 비율(2026년 5월)이에요. 대체 가능성을 뜻하지 않아요.
  판정 기준: 69.22% 이상 ○ · 41.04% 미만 × · 그 사이 △ · 기록 없음 = AI에게 거의 안 시키는 일.</p>
</main>
<script>
// g: O(○ AI가 혼자 끝낸 일) · △ · X(× 사람이 주로 한 일) · N(기록 없음 = 활동 1 정답) · ?(정답지 확인 필요)
const JOBS = [
 { name:"프로그래머", counts:[3,4,1], items:[
  ["소프트웨어 문제를 해결한다","Resolve computer software problems.","O",76.9],
  ["소프트웨어 성능을 테스트한다","Test software performance.","O",86.9],
  ["사용 설명서를 만든다","Prepare instruction manuals.","△",63.2],
  ["IT 인력을 감독한다","Supervise information technology personnel.","N"],
  ["설계·개발 절차를 문서로 남긴다","Document design or development procedures.","△",61.9],
  ["프로그래밍 코드를 작성한다","Write computer programming code.","△",63.0],
  ["컴퓨터 장비 사용법을 가르친다","Teach others to use computer equipment or hardware.","N"],
  ["웹사이트·웹 앱을 설계한다","Design websites or web applications.","△",50.5],
  ["성능을 높이려고 프로그램을 수정한다","Modify software programs to improve performance.","O",69.6],
  ["정보·통신 시스템 모델을 만든다","Develop models of information or communications systems.","X",40.7]]},
 { name:"그래픽 디자이너", counts:[2,4,2], items:[
  ["컴퓨터 그래픽이나 애니메이션을 제작한다","Create computer-generated graphics or animation.","△",56.6],
  ["클라이언트와 협의하여 요구사항을 파악한다","Confer with clients to determine needs.","△",53.7],
  ["인쇄 출판물의 레이아웃을 디자인한다","Design layouts for print publications.","△",51.4],
  ["인쇄용 디지털 파일을 준비한다","Prepare digital files for printing.","?"],
  ["기록·문서·기타 파일을 관리한다","Maintain records, documents, or other files.","O",82.3],
  ["미술 또는 디자인 자료를 검토한다","Review art or design materials.","△",44.9],
  ["작업에 참고하기 위한 조사를 수행한다","Conduct research to inform art, designs, or other work.","X",23.2],
  ["스틸 또는 비디오 카메라와 관련 장비를 운용한다","Operate still or video cameras or related equipment.","N"],
  ["광고 또는 홍보 자료를 작성한다","Write advertising or promotional material.","X",35.5],
  ["글로 작성된 자료를 편집한다","Edit written materials.","X",26.0]]},
 { name:"회계사", counts:[1,4,3], items:[
  ["인사 정책의 효과를 평가한다","Evaluate effectiveness of personnel policies or practices.","X",37.9],
  ["예산·회계 데이터를 분석한다","Analyze budgetary or accounting data.","△",49.7],
  ["의뢰인에게 법률 자문을 한다","Provide legal advice to clients.","X",29.7],
  ["관리자·동료에게 정보를 보고한다","Report information to managers or other personnel.","O",79.1],
  ["경영진과 사업 전략·정책을 논의한다","Discuss business strategies, practices, or policies with managers.","N"],
  ["재무 문제에 대해 조언한다","Advise others on financial matters.","X",35.5],
  ["기록이 정확한지 검증한다","Verify accuracy of records.","△",53.4],
  ["금전 조건을 협상한다","Negotiate financial arrangements.","N"],
  ["법률 쟁점을 조사한다","Investigate legal issues.","△",55.6],
  ["재무 문서·보고서·예산안을 작성한다","Prepare financial documents, reports, or budgets.","△",45.5]]},
 { name:"국과수 연구원", counts:[2,4,2], items:[
  ["생물학적 시료를 분석한다","Analyze biological samples.","O",70.7],
  ["과학자·기술 전문가와 연구를 협업한다","Collaborate on research activities with scientists or technical specialists.","X",12.5],
  ["범죄 현장을 조사해 증거를 확보한다","Examine crime scenes to obtain evidence.","N"],
  ["데이터가 정확한지 검증한다","Verify accuracy of data.","△",46.7],
  ["재판·입법 절차에서 증언한다","Testify at legal or legislative proceedings.","N"],
  ["기술·과학 절차를 교육한다","Train personnel in technical or scientific procedures.","△",42.5],
  ["연구·운영 데이터를 기록한다","Record research or operational data.","O",91.9],
  ["거리나 치수를 측정한다","Measure distances or dimensions.","△",68.2],
  ["연구·운영 데이터를 해석한다","Interpret research or operational data.","X",40.8],
  ["기술·과학 보고서와 발표자료를 제작한다","Prepare scientific or technical reports or presentations.","△",42.9]]}
];
const SHOW = { O:"○", "△":"△", X:"×" };
const CYCLE = ["", "O", "△", "X"];
let cur = 0, state = JOBS.map(() => ({ picks:new Set(), g:{}, reveal:false }));
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function render() {
  document.getElementById("tabs").innerHTML = JOBS.map((j, i) => `<button class="btn" role="tab" aria-selected="${i === cur}" onclick="cur=${i};render()">${j.name}</button>`).join("");
  const j = JOBS[cur], s = state[cur];
  const ans = (it, i) => {
    if (!s.reveal) return "";
    const [,, g, pct] = it;
    if (g === "?") return `<span class="ans">AI 기록: 정답지에서 확인해 주세요</span>`;
    if (g === "N") return `<span class="ans ${s.picks.has(i) ? "ok" : "no"}">AI 대화 기록 없음 → 활동 1 정답</span>`;
    const mine = s.g[i];
    return `<span class="ans ${mine === g ? "ok" : "no"}">AI 기록: ${SHOW[g]} · AI가 끝까지 처리한 비율 ${pct}%</span>`;
  };
  const list = (mode) => j.items.map((it, i) => {
    const picked = s.picks.has(i);
    if (mode === 1) return `<li class="${picked ? "pick" : ""}" onclick="pick(${i})"><span class="num">${i + 1}</span><span class="t">${esc(it[0])}<small>${esc(it[1])}</small>${ans(it, i)}</span><span class="mark">${picked ? "✓" : ""}</span></li>`;
    if (picked) return `<li class="locked"><span class="num">${i + 1}</span><span class="t">${esc(it[0])}</span><span class="mark">✓</span></li>`;
    const g = s.g[i] || "";
    return `<li data-g="${g}" onclick="grade(${i})"><span class="num">${i + 1}</span><span class="t">${esc(it[0])}${ans(it, i)}</span><span class="mark">${SHOW[g] || "?"}</span></li>`;
  }).join("");
  const n = k => Object.values(s.g).filter(v => v === k).length;
  document.getElementById("sheet").className = "sheet" + (s.reveal ? " reveal" : "");
  document.getElementById("sheet").innerHTML = `
    <div class="goal"><b>학습목표</b> 하나의 직업이 여러 '직무'로 이루어져 있음을 알고, 직무마다 AI가 어디까지 쓰이고 있을지 예상하여 분류할 수 있다.</div>
    <p style="margin:0;font-weight:700">▶ ${j.name}가 하는 일 10가지입니다. 먼저 2가지를 고르고, 남은 8가지를 다시 ○·△·×로 나눕니다.</p>
    <div class="act"><h2>활동 1. 사람들이 AI에게 시키지 않을 것 같은 일 2가지</h2>
      <p>AI와 나눈 대화 기록에 한 번도 안 나왔을 것 같은 일을 눌러 ✓ 표를 해 봅시다. (${s.picks.size}/2)</p>
      <ol class="tasks">${list(1)}</ol></div>
    <div class="act"><h2>활동 2. 남은 8가지를 ○ · △ · ×로 나누기</h2>
      <p>누를 때마다 ○ → △ → × 로 바뀌어요.</p>
      <div class="legend"><span>○ AI가 혼자 끝낸 일 <b class="count">${n("O")}/${j.counts[0]}</b></span><span>△ AI와 같이 수행한 일 <b class="count">${n("△")}/${j.counts[1]}</b></span><span>× 사람이 주로 한 일 <b class="count">${n("X")}/${j.counts[2]}</b></span></div>
      <ol class="tasks">${list(2)}</ol></div>
    <div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" onclick="state[cur].reveal=!state[cur].reveal;render()">${s.reveal ? "정답 숨기기" : "AI 기록과 비교하기"}</button>
      <button class="btn sub" onclick="state[cur]={picks:new Set(),g:{},reveal:false};render()">다시 하기</button>
    </div>`;
}
function pick(i) { const s = state[cur]; if (s.picks.has(i)) s.picks.delete(i); else if (s.picks.size < 2) { s.picks.add(i); delete s.g[i]; } render(); }
function grade(i) { const s = state[cur]; s.g[i] = CYCLE[(CYCLE.indexOf(s.g[i] || "") + 1) % CYCLE.length]; render(); }
render();
</script>
</body>
</html>
