<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 A 메신저 업무톡</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--cream:#FFF8E7;--cream-2:#F6ECD3;--yolk:#FFD15C;--yolk-d:#F2B233;--sky:#8EC5FF;--sky-d:#5C9EE6;--rose:#FF9AA8;--mint:#7DD3B8;--mint-d:#4FB496;--ink:#3E2F27}
*{box-sizing:border-box}body{margin:0;font-family:Jua,sans-serif;color:var(--ink);background:#B9D9F5}
.phone{width:390px;height:844px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(#CFE6FA,#EAF4FF);overflow:hidden}
.hud{display:flex;align-items:center;gap:8px;padding:12px 12px 6px}
.pill{background:var(--cream);border-radius:999px;height:40px;display:flex;align-items:center;gap:4px;padding:0 12px;box-shadow:0 3px 0 var(--cream-2);font-size:17px}
.pill img{width:30px;height:30px;object-fit:contain}.grow{flex:1}
.gauge{display:flex;align-items:center;gap:3px;padding:0 14px 8px}.gauge img{width:28px}.gauge i{flex:1;height:10px;border-radius:9px;background:rgba(255,255,255,.7)}.gauge i.on{background:var(--yolk)}
.chat{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:8px 12px;overflow:hidden}
.msg{display:flex;gap:8px;align-items:flex-end}.msg .av{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}.msg .av img{width:32px}
.bub{background:#fff;border-radius:20px 20px 20px 6px;padding:10px 14px;font-size:19px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.05)}
.ring{position:absolute;right:-12px;top:-12px;width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--rose) 0 70%,#eee 0)}
.ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
.msg.me{justify-content:flex-end}.msg.me .bub{background:var(--yolk);border-radius:20px 20px 6px 20px}
.msg.ai .bub{background:#DCEBFF;color:#2B5EA8}.done{opacity:.45;text-decoration:line-through}
.tag{font-size:13px;color:#8A7B6E;margin:0 0 2px 48px}
.passbtn{margin-left:6px;background:var(--rose);border:0;border-radius:999px;padding:6px 10px;display:flex;align-items:center;gap:4px;color:#fff;font:inherit;font-size:15px;box-shadow:0 3px 0 #EE6F84}
.passbtn img{width:22px}
.dock{display:flex;gap:8px;padding:8px 10px;background:var(--cream)}
.dock div{flex:1;height:44px;border-radius:999px;background:#fff;display:flex;align-items:center;padding:0 16px;font-size:18px}
.dock b{width:44px;height:44px;border-radius:50%;background:var(--yolk);box-shadow:0 3px 0 var(--yolk-d)}
.kb{height:300px;background:#D1D4DB;display:grid;place-items:center;color:#8A8F99;font-size:22px}
.label{position:absolute;margin:8px;background:#3E2F27;color:#fff;border-radius:999px;padding:4px 12px;font-size:15px}
</style></head><body><div class="phone">
<span class="label">시안 A · 메신저 업무톡</span>
<div class="hud" style="margin-top:28px"><span class="pill">1/5 서류</span><span class="grow"></span><span class="pill"><img src="../assets/items/grab.png">2</span><span class="pill"><img src="../assets/items/letter.png"><img src="../assets/items/letter.png" style="filter:grayscale(1) opacity(.35)"><img src="../assets/items/letter.png" style="filter:grayscale(1) opacity(.35)"></span></div>
<div class="gauge"><img src="../assets/items/star.png"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="chat">
  <p class="tag">팀장님</p>
  <div class="msg"><span class="av"><img src="../assets/items/badge.png"></span><span class="bub done">API 문서 정리</span></div>
  <div class="msg ai"><span class="av"><img src="../assets/ai_cut.png"></span><span class="bub">제가 할게요! <img src="../assets/items/grab.png" style="width:22px;vertical-align:middle"></span></div>
  <div class="msg"><span class="av"><img src="../assets/items/badge.png"></span><span class="bub">서비스 구조 설계</span></div>
  <div class="msg me"><span class="bub">서비스 구조 설계 ✓</span></div>
  <p class="tag">마케팅팀</p>
  <div class="msg"><span class="av"><img src="../assets/items/coins.png"></span><span class="bub">회원가입 이벤트 기획</span><button class="passbtn"><img src="../assets/items/ban.png">넘기기</button></div>
  <p class="tag">팀장님</p>
  <div class="msg"><span class="av"><img src="../assets/items/badge.png"></span><span class="bub">기획자와 요구사항 정의<i class="ring"></i></span></div>
</div>
<div class="dock"><div>기획자와 요구</div><b></b></div>
<div class="kb">폰 키보드</div>
</div></body></html>
