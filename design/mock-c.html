<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 C 가로 산성비</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--cream:#FFF8E7;--cream-2:#F6ECD3;--yolk:#FFD15C;--yolk-d:#F2B233;--sky:#8EC5FF;--ink:#3E2F27}
*{box-sizing:border-box}body{margin:0;font-family:Jua,sans-serif;color:var(--ink);background:#B9D9F5}
.phone{width:390px;height:844px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:url(../assets/bg/lift_day.jpg) center/cover}
.hud{display:flex;align-items:center;gap:8px;padding:12px 12px 6px;margin-top:28px}
.pill{background:var(--cream);border-radius:999px;height:40px;display:flex;align-items:center;gap:4px;padding:0 12px;box-shadow:0 3px 0 var(--cream-2);font-size:17px}
.pill img{width:30px;height:30px;object-fit:contain}.grow{flex:1}
.field{flex:1;position:relative}
.lane{position:absolute;left:0;right:0;height:64px;border-top:3px dashed rgba(255,255,255,.6)}
.w{position:absolute;background:#fff;border-radius:999px;padding:8px 14px;font-size:18px;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.w.ai{background:#DCEBFF;box-shadow:0 0 0 4px var(--sky)}
.pot{position:absolute;left:-6px;bottom:6px;width:92px}
.aib{position:absolute;right:6px;top:4px;width:70px}
.grab{position:absolute;width:44px}
.arrow{position:absolute;left:96px;font-size:26px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3)}
.gauge{position:absolute;left:12px;right:12px;top:6px;display:flex;gap:3px;align-items:center}.gauge img{width:26px}.gauge i{flex:1;height:9px;border-radius:9px;background:rgba(255,255,255,.7)}.gauge i.on{background:var(--yolk)}
.dock{display:flex;gap:8px;padding:8px 10px;background:var(--cream)}
.dock div{flex:1;height:44px;border-radius:999px;background:#fff;display:flex;align-items:center;padding:0 16px;font-size:18px}
.dock b{width:44px;height:44px;border-radius:50%;background:var(--yolk);box-shadow:0 3px 0 var(--yolk-d)}
.kb{height:300px;background:#D1D4DB;display:grid;place-items:center;color:#8A8F99;font-size:22px}
.label{position:absolute;margin:8px;background:#3E2F27;color:#fff;border-radius:999px;padding:4px 12px;font-size:15px}
</style></head><body><div class="phone">
<span class="label">시안 C · 가로로 흐르는 산성비</span>
<div class="hud"><span class="pill">1/5 서류</span><span class="grow"></span><span class="pill"><img src="../assets/items/grab.png">2</span><span class="pill"><img src="../assets/items/letter.png"></span></div>
<div class="field">
  <div class="gauge"><img src="../assets/items/star.png"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
  <img class="aib" src="../assets/ai_cut.png">
  <div class="lane" style="top:44px"></div><div class="lane" style="top:108px"></div><div class="lane" style="top:172px"></div>
  <span class="w" style="top:58px;left:150px">API 서버 코드 작성</span>
  <span class="w ai" style="top:122px;left:230px">부하 테스트</span><img class="grab" src="../assets/items/grab.png" style="top:110px;left:330px">
  <span class="w" style="top:186px;left:120px">서비스 구조 설계</span>
  <span class="w" style="top:250px;left:270px">회원가입 이벤트</span>
  <span class="arrow" style="top:190px">◀</span>
  <img class="pot" src="../assets/potato_cut.png">
</div>
<div class="dock"><div>서비스 구조</div><b></b></div>
<div class="kb">폰 키보드</div>
</div></body></html>
